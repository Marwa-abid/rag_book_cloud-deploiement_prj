
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-cloud-backend
    ports:
      - "9501:9501"
    env_file:
      - ./backend/.env
    environment:
      CHROMA_PATH: /app/chroma_db
      BOOK_PATH: /app/data/livre.pdf
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-cloud-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
